server:
  port: 8090

spring:
  application:
    name: booking-app
  datasource:
    url: jdbc:h2:mem:bookingdb
    driver-class-name: org.h2.Driver
    username: sa
    dbcp2:
      default-schema: bookingapp
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console